<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>英文字母書寫練習</title>
  <meta name="description" content="中英文雙語英文字母書寫練習，包含課堂印刷體與傳統美式校園草寫大小寫。" />
  <style>
    :root{
      --bg:#090a0c;
      --panel:rgba(255,255,255,.055);
      --panel2:rgba(255,255,255,.025);
      --text:#f7f8fb;
      --muted:#9aa1ad;
      --border:rgba(255,255,255,.09);
      --accent:#5b9cff;
      --accent-bg:rgba(59,130,246,.20);
      --danger:#ff6b6b;
      --success:#64d98b;
    }
    :root[data-theme="light"]{
      --bg:#f4f6f8;
      --panel:rgba(255,255,255,.78);
      --panel2:rgba(255,255,255,.58);
      --text:#111827;
      --muted:#6b7280;
      --border:rgba(15,23,42,.12);
      --accent:#3b82f6;
      --accent-bg:rgba(59,130,246,.14);
      --danger:#dc2626;
      --success:#16a34a;
    }

    :root[data-theme="light"] body{
      background:
        radial-gradient(circle at top left, rgba(59,130,246,.06), transparent 28%),
        var(--bg);
    }

    :root[data-theme="light"] .glass-shell,
    :root[data-theme="light"] .glass-btn{
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.8),
        0 8px 24px rgba(15,23,42,.08);
    }

    :root[data-theme="light"] .lang-switch,
    :root[data-theme="light"] .theme-switch{
      background:#e7edf5;
      border-color:rgba(15,23,42,.12);
    }

    :root[data-theme="light"] .lang-half,
    :root[data-theme="light"] .theme-half{
      color:#64748b;
    }

    :root[data-theme="light"] .lang-half.active,
    :root[data-theme="light"] .theme-half.active{
      color:#0f172a;
    }

    :root[data-theme="light"] .language-label,
    :root[data-theme="light"] .theme-label{
      color:#64748b;
    }


    *{box-sizing:border-box}

    html,body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",Arial,sans-serif;
    }

    body{
      min-height:100vh;
      margin:0;
      padding:0;
      overflow:auto;
      background:var(--bg);
      text-align:left;
    }

    /* 真正的 CSS RWD：最大 390px、永遠靠左、不使用 transform 縮放 */
    .viewport-fit{
      position:relative;
      width:min(390px,100vw);
      max-width:390px;
      min-width:0;
      margin:0;
      padding:0;
      overflow:visible;
    }

    .scale-stage{
      width:100%;
      max-width:390px;
      min-width:0;
      margin:0;
      padding:0;
      transform:none !important;
    }

    .app{
      width:100%;
      max-width:390px;
      min-width:0;
      margin:0;
      padding:10px;
      display:grid;
      gap:10px;
    }

    button{font:inherit;color:inherit}

    .glass-shell{
      border:1px solid var(--border);
      border-radius:24px;
      background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));
      backdrop-filter:blur(20px) saturate(155%);
      -webkit-backdrop-filter:blur(20px) saturate(155%);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 12px 32px rgba(0,0,0,.18);
    }

    .glass-btn{
      position:relative;
      min-height:38px;
      border:1px solid rgba(255,255,255,.14);
      border-radius:999px;
      padding:0 18px;
      color:var(--text);
      font-weight:700;
      background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
      backdrop-filter:blur(18px) saturate(160%);
      -webkit-backdrop-filter:blur(18px) saturate(160%);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 22px rgba(0,0,0,.13);
      transition:transform .16s ease,border-color .16s ease,background .16s ease;
      cursor:pointer;
    }

    .glass-btn::before{
      content:"";
      position:absolute;
      left:14px;right:14px;top:5px;height:34%;
      border-radius:999px;
      background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,0));
      pointer-events:none;
    }

    .glass-btn:active{transform:scale(.98)}
    .glass-btn.active,.primary{
      border-color:rgba(74,142,255,.8);
      background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05)),var(--accent-bg);
    }
    .glass-btn:disabled{opacity:.35;cursor:not-allowed;transform:none}

    .topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
    .brand{font-size:clamp(20px,5.6vw,26px);font-weight:800;letter-spacing:-.03em}
    .subtitle{color:var(--muted);font-size:13px;margin-top:4px}
    .language-control{
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      gap:7px;
      flex:0 0 auto;
    }

    .language-label{
      color:#aeb8ca;
      font-size:13px;
      font-weight:700;
      letter-spacing:.01em;
      line-height:1;
      padding-left:2px;
      white-space:nowrap;
    }

    .lang-switch{
      position:relative;
      display:grid;
      grid-template-columns:1fr 1fr;
      width:156px;
      height:42px;
      padding:4px;
      border:1px solid rgba(255,255,255,.15);
      border-radius:999px;
      background:#0c1830;
      color:var(--text);
      cursor:pointer;
      overflow:hidden;
      isolation:isolate;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.04),
        0 0 0 1px rgba(255,255,255,.02),
        0 8px 20px rgba(0,0,0,.22);
      -webkit-tap-highlight-color:transparent;
      transition:transform .16s ease;
    }

    .lang-switch:active{transform:scale(.985)}

    .lang-half{
      position:relative;
      z-index:2;
      display:flex;
      align-items:center;
      justify-content:center;
      min-width:0;
      height:34px;
      padding:0 8px;
      font-size:12px;
      font-weight:800;
      color:#b9c5d8;
      white-space:nowrap;
      pointer-events:none;
      transition:color .22s ease;
    }

    .lang-half.active{color:#0a1730}

    .lang-thumb{
      position:absolute;
      z-index:1;
      left:4px;
      top:4px;
      width:calc(50% - 4px);
      height:34px;
      border-radius:999px;
      background:#ffbd4a;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.42),
        0 5px 14px rgba(0,0,0,.18);
      transition:transform .24s cubic-bezier(.2,.8,.2,1);
      pointer-events:none;
    }

    .lang-switch.is-en .lang-thumb{transform:translateX(100%)}

    .styles{display:grid;grid-template-columns:repeat(2,max-content);justify-content:start;align-items:center;gap:8px}
    .style-btn{width:auto;min-width:0;min-height:38px;border-radius:999px;padding:0 14px;font-size:13px;white-space:nowrap}

    .letter-card{padding:12px;min-width:0;overflow:hidden}
    .letter-main{display:flex;align-items:center;justify-content:space-between;gap:16px}
    .nav{width:clamp(42px,12vw,48px);height:clamp(42px,12vw,48px);min-height:0;padding:0;font-size:clamp(1.35rem,6vw,1.65rem);line-height:1;flex:0 0 auto}
    .center{text-align:center;min-width:0}
    .current-label{font-size:12px;color:var(--muted)}
    .letter-display{font-size:clamp(42px,12vw,52px);line-height:1;font-weight:700;margin-top:5px}
    .letter-display.cursive{
      font-family:"Apple Chancery","Snell Roundhand","Segoe Script","Brush Script MT",cursive;
      font-size:clamp(54px,16vw,66px);
      font-weight:500;
    }
    .letter-display.cursive{
      min-width:92px;
      height:72px;
      margin-top:2px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:0;
    }
    .letter-display.cursive svg{
      width:clamp(76px,18vw,98px);
      height:72px;
      overflow:visible;
      display:block;
    }


    .count{margin-top:8px;font-size:14px;color:var(--muted)}
    .alphabet{
      display:flex;
      width:100%;
      max-width:100%;
      min-width:0;
      gap:clamp(6px,2vw,8px);
      overflow-x:auto;
      overflow-y:hidden;
      padding-top:14px;
      padding-bottom:8px;
      scroll-behavior:smooth;
      scrollbar-width:thin;
      scrollbar-gutter:stable;
      -webkit-overflow-scrolling:touch;
      overscroll-behavior-x:contain;
      touch-action:pan-x;
      cursor:grab;
      user-select:none;
      -webkit-user-select:none;
    }
    .alphabet.is-dragging{
      cursor:grabbing;
      scroll-behavior:auto;
    }
    .alphabet > *{
      scroll-snap-align:center;
    }
    .alpha{min-width:40px;width:40px;height:38px;min-height:38px;flex:0 0 auto;padding:0 6px;font-size:13px}
    .alpha.cursive{
      font-family:"Apple Chancery","Snell Roundhand","Segoe Script","Brush Script MT",cursive;
      font-size:1.55rem;
      font-weight:500;
    }

    .alpha.cursive{font-size:0;display:grid;place-items:center;padding:3px 5px}
    .alpha.cursive svg{width:30px;height:30px;display:block;overflow:visible}

    .modes{display:grid;grid-template-columns:repeat(3,max-content);justify-content:start;align-items:center;gap:8px}
    .mode{width:auto;min-width:0;min-height:38px;border-radius:999px;padding:0 15px;font-size:13px;white-space:nowrap}

    .practice{padding:12px;display:flex;flex-direction:column;align-items:center}
    .practice > .title,.practice > .status,.practice > .feedback-row{width:100%}
    .practice > .status{margin-bottom:2px}
    .stroke-controls,.board{align-self:center}
    .title{font-size:16px;font-weight:700}
    .status{color:var(--muted);font-size:14px;margin-top:4px}

    .stroke-controls{
      display:flex;
      justify-content:center;
      gap:8px;
      flex-wrap:wrap;
      margin:12px 0;
      width:auto;
      max-width:100%;
    }

    .stroke-control{width:auto;min-width:88px;flex:0 0 auto;min-height:38px;padding:0 14px;font-size:13px;white-space:nowrap}

    .board{
      position:relative;
      width:100%;
      max-width:330px;
      aspect-ratio:1/1;
      margin:0 auto;
      overflow:hidden;
      border-radius:20px;
      border:1px solid var(--border);
      background:var(--panel2);
      touch-action:none;
    }

    .board svg,.board canvas{position:absolute;inset:0;width:100%;height:100%}
    .feedback-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px}
    .feedback{font-size:14px;min-height:22px}
    .clear{min-height:clamp(38px,10.5vw,42px);padding:0 clamp(10px,3vw,14px);font-size:clamp(.76rem,3.4vw,.9rem)}
    .footer-note{text-align:center;color:var(--muted);font-size:12px;padding:6px 0 12px}

    @media (max-width:340px){
      .app{padding:8px;gap:8px}
      .topbar{gap:8px}
      .subtitle{font-size:12px}
      .lang-switch{padding:3px}
      .lang{min-height:34px;padding:0 10px;font-size:.82rem}
      .styles{grid-template-columns:repeat(2,max-content);gap:6px}
      .style-btn{min-height:36px;padding:0 11px;font-size:12px}
      .letter-card{padding:10px}
      .letter-main{gap:10px}
      .modes{grid-template-columns:repeat(3,max-content);gap:5px}
      .mode{min-height:36px;padding:0 11px;font-size:12px}
      .practice{padding:10px}
      .stroke-controls{gap:6px;margin:10px 0}
      .stroke-control{min-width:78px;min-height:36px;padding:0 10px;font-size:12px}
      .feedback-row{gap:8px;margin-top:10px}
    }

    @media (max-width:300px){
      .styles{grid-template-columns:max-content}
      .modes{display:flex;flex-wrap:wrap;justify-content:flex-start}
      .stroke-controls{justify-content:flex-start}
    }
  
    /* ===== Critical grid overflow fix =====
       The 26-letter horizontal strip must scroll inside 390px; it must not
       enlarge the CSS grid's implicit column to its full intrinsic width. */
    .app{
      grid-template-columns:minmax(0, 1fr) !important;
      overflow:hidden;
    }

    .app > *,
    .topbar,
    .styles,
    .letter-card,
    .letter-main,
    .alphabet,
    .modes,
    .practice,
    .stroke-controls,
    .feedback-row{
      min-width:0;
      max-width:100%;
    }

    .letter-card,
    .practice{
      width:100%;
    }

    .alphabet{
      width:100%;
      overflow-x:auto;
      overflow-y:hidden;
      contain:inline-size;
    }

    .styles,
    .modes{
      width:max-content;
      justify-self:start;
    }

    @media (max-width:340px){
      .styles,
      .modes{
        width:100%;
      }
    }

  

    /* ===== Fluid viewport layout final ===== */
    /*
      The application now uses the full browser viewport.
      It changes from one column to two columns according to available width,
      while buttons remain compact instead of being enlarged with the page.
    */
    :root{
      --page-pad:clamp(8px,1.2vw,20px);
      --section-gap:clamp(8px,.9vw,14px);
      --compact-h:clamp(36px,2.6vw,42px);
      --compact-font:clamp(12px,.85vw,14px);
    }

    html,body{
      width:100%;
      max-width:100%;
      min-width:0;
      overflow-x:hidden;
    }

    body{min-height:100dvh}

    .viewport-fit,
    .scale-stage{
      width:100% !important;
      max-width:none !important;
      min-width:0 !important;
      height:auto !important;
      margin:0 !important;
      padding:0 !important;
      transform:none !important;
      overflow:visible !important;
    }

    .app{
      width:100% !important;
      max-width:none !important;
      min-width:0 !important;
      margin:0 !important;
      padding:var(--page-pad) !important;
      gap:var(--section-gap) !important;
      display:grid !important;
      grid-template-columns:minmax(0,1fr) !important;
      grid-template-areas:
        "header"
        "styles"
        "letters"
        "modes"
        "practice"
        "footer";
      align-items:start;
      overflow:visible !important;
    }

    .topbar{grid-area:header}
    .styles{grid-area:styles}
    .letter-card{grid-area:letters}
    .modes{grid-area:modes}
    .practice{grid-area:practice}
    .footer-note{grid-area:footer}

    .styles,
    .modes{
      display:flex !important;
      flex-wrap:wrap;
      align-items:center;
      justify-content:flex-start !important;
      width:auto !important;
      max-width:100% !important;
      gap:clamp(6px,.7vw,10px) !important;
      justify-self:start;
    }

    .style-btn,
    .mode,
    .stroke-control{
      width:auto !important;
      min-width:0 !important;
      min-height:var(--compact-h) !important;
      padding:0 clamp(11px,1vw,16px) !important;
      border-radius:999px !important;
      font-size:var(--compact-font) !important;
      line-height:1 !important;
      white-space:nowrap;
      flex:0 0 auto !important;
    }

    .stroke-controls{
      display:flex !important;
      flex-wrap:wrap;
      align-items:center;
      justify-content:center !important;
      width:auto !important;
      max-width:100% !important;
      gap:clamp(6px,.7vw,10px) !important;
      margin:clamp(10px,1vw,14px) auto !important;
      align-self:center;
    }

    .letter-card,
    .practice{
      width:100% !important;
      max-width:none !important;
      min-width:0;
    }

    .letter-card{padding:clamp(10px,1vw,16px)}
    .practice{padding:clamp(10px,1.1vw,18px)}

    .alphabet{
      width:100% !important;
      max-width:100% !important;
      min-width:0;
      overflow-x:auto;
      overflow-y:hidden;
      contain:inline-size;
    }

    /* One-column phones/tablets use most of the available screen width. */
    .board{
      width:min(100%,88vmin,760px) !important;
      max-width:none !important;
      margin-inline:auto !important;
    }

    .feedback-row{
      max-width:900px;
      margin-inline:auto;
    }

    /* Landscape tablets and desktops become a fluid two-column workspace. */
    @media (min-width:900px){
      .app{
        grid-template-columns:minmax(300px,36%) minmax(0,1fr) !important;
        grid-template-areas:
          "header header"
          "styles modes"
          "letters practice"
          "footer footer";
      }

      .letter-card{align-self:start}
      .practice{min-height:calc(100dvh - 150px)}
      .board{width:min(100%,clamp(360px,52vmin,760px)) !important}
    }

    @media (min-width:1180px){
      .app{grid-template-columns:minmax(330px,430px) minmax(0,1fr) !important}
      .board{width:min(100%,clamp(430px,56vmin,820px)) !important}
    }

    @media (min-width:1800px){
      .app{grid-template-columns:minmax(380px,500px) minmax(0,1fr) !important}
      .board{width:min(100%,clamp(520px,52vmin,900px)) !important}
    }

    @media (max-width:420px){
      .topbar{gap:8px}
      .styles,.modes{width:100% !important}
      .style-btn,.mode{padding-inline:10px !important}
      .stroke-controls{width:100% !important}
      .stroke-control{
        flex:1 1 0 !important;
        min-width:82px !important;
        padding-inline:6px !important;
      }
      .board{width:100% !important}
    }



    /* ===== Unified vector previews =====
       The current letter and A–Z strip now display the exact SVG paths used on
       the practice board, so the print model cannot silently fall back to a
       browser/system font. */
    .letter-display.vector{
      min-width:104px;
      height:82px;
      margin-top:1px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:0;
      line-height:0;
    }

    .letter-display.vector svg{
      width:clamp(82px,20vw,112px);
      height:82px;
      display:block;
      overflow:visible;
    }

    .letter-display.vector.cursive svg{
      width:clamp(84px,21vw,116px);
    }

    .alpha.vector{
      display:grid;
      place-items:center;
      padding:2px 4px;
      font-size:0;
      line-height:0;
    }

    .alpha.vector svg{
      width:32px;
      height:32px;
      display:block;
      overflow:visible;
    }

    .alpha.vector.cursive svg{
      width:31px;
      height:31px;
    }

  
    @media (max-width:430px){
      .language-label{font-size:11px}
      .lang-switch{
        width:148px;
        height:40px;
        padding:4px;
      }
      .lang-half{
        height:32px;
        font-size:11.5px;
      }
      .lang-thumb{
        left:4px;
        top:4px;
        width:calc(50% - 4px);
        height:32px;
      }
    }

  
    .alpha{
      cursor:pointer;
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }
    .alpha:active{
      transform:scale(.96);
    }

  
    .control-cluster{
      display:flex;
      align-items:flex-start;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .theme-control{
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      gap:7px;
      flex:0 0 auto;
    }

    .theme-label{
      color:#aeb8ca;
      font-size:13px;
      font-weight:700;
      letter-spacing:.01em;
      line-height:1;
      padding-left:2px;
      white-space:nowrap;
    }

    .theme-switch{
      position:relative;
      display:grid;
      grid-template-columns:1fr 1fr;
      width:138px;
      height:42px;
      padding:4px;
      border:1px solid rgba(255,255,255,.15);
      border-radius:999px;
      background:#0c1830;
      color:var(--text);
      cursor:pointer;
      overflow:hidden;
      isolation:isolate;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.04),
        0 0 0 1px rgba(255,255,255,.02),
        0 8px 20px rgba(0,0,0,.16);
      -webkit-tap-highlight-color:transparent;
      transition:transform .16s ease;
    }

    .theme-switch:active{transform:scale(.985)}

    .theme-half{
      position:relative;
      z-index:2;
      display:flex;
      align-items:center;
      justify-content:center;
      min-width:0;
      height:34px;
      padding:0 8px;
      font-size:12px;
      font-weight:800;
      color:#b9c5d8;
      white-space:nowrap;
      pointer-events:none;
      transition:color .22s ease;
    }

    .theme-half.active{color:#0a1730}

    .theme-thumb{
      position:absolute;
      z-index:1;
      left:4px;
      top:4px;
      width:calc(50% - 4px);
      height:34px;
      border-radius:999px;
      background:#ffbd4a;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.42),
        0 5px 14px rgba(0,0,0,.15);
      transition:transform .24s cubic-bezier(.2,.8,.2,1);
      pointer-events:none;
    }

    .theme-switch.is-light .theme-thumb{transform:translateX(100%)}

    @media (max-width:520px){
      .control-cluster{
        width:100%;
        justify-content:flex-start;
      }
      .theme-label{font-size:11px}
      .theme-switch{
        width:132px;
        height:40px;
      }
      .theme-half{
        height:32px;
        font-size:11.5px;
      }
      .theme-thumb{
        height:32px;
      }
    }

  
    .worksheet-launch{
      display:flex;
      justify-content:flex-start;
    }

    .worksheet-main-btn{
      min-width:140px;
      min-height:42px;
      padding:0 18px;
    }

    .worksheet-panel[hidden]{display:none}

    .worksheet-panel{
      position:fixed;
      inset:0;
      z-index:9999;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .worksheet-backdrop{
      position:absolute;
      inset:0;
      background:rgba(0,0,0,.58);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
    }

    .worksheet-dialog{
      position:relative;
      z-index:1;
      width:min(1180px,96vw);
      max-height:94vh;
      overflow:auto;
      border:1px solid var(--border);
      border-radius:24px;
      background:var(--bg);
      box-shadow:0 24px 80px rgba(0,0,0,.35);
      padding:20px;
    }

    .worksheet-header{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      margin-bottom:18px;
    }

    .worksheet-kicker{
      color:var(--muted);
      font-size:12px;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.08em;
    }

    .worksheet-header h2{
      margin:4px 0 0;
      font-size:24px;
    }

    .worksheet-close{
      width:40px;
      height:40px;
      min-height:40px;
      padding:0;
      font-size:22px;
    }

    .worksheet-builder-grid{
      display:grid;
      grid-template-columns:minmax(280px,360px) minmax(0,1fr);
      gap:20px;
      align-items:start;
    }

    .worksheet-settings{
      display:grid;
      gap:14px;
      position:sticky;
      top:0;
    }

    .ws-row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .ws-field{
      display:grid;
      gap:7px;
      color:var(--muted);
      font-size:12px;
      font-weight:700;
    }

    .ws-field input,
    .ws-field select{
      width:100%;
      min-height:42px;
      border:1px solid var(--border);
      border-radius:14px;
      padding:0 12px;
      background:var(--panel);
      color:var(--text);
      font:inherit;
      outline:none;
    }

    .ws-letter-actions{
      display:flex;
      gap:6px;
    }

    .ws-mini-btn{
      min-height:32px;
      padding:0 10px;
      font-size:12px;
    }

    .ws-letter-picker{
      display:grid;
      grid-template-columns:repeat(7,1fr);
      gap:6px;
    }

    .ws-letter-chip{
      min-height:34px;
      border:1px solid var(--border);
      border-radius:10px;
      background:var(--panel);
      color:var(--text);
      cursor:pointer;
      font-weight:800;
    }

    .ws-letter-chip.active{
      border-color:var(--accent);
      background:var(--accent-bg);
    }

    .ws-check{
      display:flex;
      align-items:center;
      gap:7px;
      color:var(--muted);
      font-size:13px;
      font-weight:700;
    }

    .worksheet-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .worksheet-preview-wrap{
      overflow:auto;
      padding:8px;
      border:1px solid var(--border);
      border-radius:18px;
      background:var(--panel2);
    }

    .worksheet-page{
      width:794px;
      min-height:1123px;
      margin:0 auto;
      background:#fff;
      color:#111;
      box-shadow:0 12px 36px rgba(0,0,0,.18);
      padding:42px 48px;
      font-family:Arial,Helvetica,sans-serif;
    }

    .worksheet-page.letter-paper{
      width:816px;
      min-height:1056px;
    }

    .ws-placeholder{
      display:grid;
      place-items:center;
      min-height:420px;
      color:#999;
      font-size:18px;
    }

    .ws-sheet-title{
      text-align:center;
      font-size:26px;
      font-weight:800;
      margin-bottom:18px;
    }

    .ws-meta{
      display:flex;
      justify-content:space-between;
      gap:20px;
      font-size:14px;
      margin-bottom:24px;
    }

    .ws-meta-line{
      flex:1;
      border-bottom:1px solid #666;
      padding-bottom:5px;
    }

    .ws-practice-block{
      margin-bottom:18px;
      break-inside:avoid;
    }

    .ws-practice-label{
      font-size:13px;
      font-weight:700;
      margin-bottom:6px;
      color:#555;
    }

    .ws-line{
      position:relative;
      height:92px;
      margin-bottom:8px;
      border-top:1px solid #cbd5e1;
      border-bottom:2px solid #94a3b8;
      overflow:hidden;
    }

    .ws-line::before{
      content:"";
      position:absolute;
      left:0;right:0;
      top:45%;
      border-top:1px dashed #cbd5e1;
    }

    .ws-line::after{
      content:"";
      position:absolute;
      left:0;right:0;
      top:72%;
      border-top:1px solid #e2e8f0;
    }

    .ws-models{
      position:relative;
      z-index:1;
      height:100%;
      display:flex;
      align-items:flex-end;
      gap:26px;
      padding:0 14px 10px;
    }

    .ws-model-char{
      font-size:64px;
      line-height:.95;
      font-weight:500;
      color:#111;
    }

    .ws-model-char.trace{
      color:#c8c8c8;
      -webkit-text-stroke:1px #aaa;
    }

    .ws-model-char.copy-fade{
      color:#d8d8d8;
    }

    .ws-free-space{
      flex:1;
      min-width:70px;
    }

    @media (max-width:820px){
      .worksheet-panel{padding:8px}
      .worksheet-dialog{width:100%;max-height:97vh;padding:14px}
      .worksheet-builder-grid{grid-template-columns:1fr}
      .worksheet-settings{position:static}
      .worksheet-preview-wrap{max-width:100%}
      .worksheet-page{
        transform-origin:top left;
      }
    }

    @media print{
      body *{visibility:hidden !important}
      #worksheetPreview,
      #worksheetPreview *{visibility:visible !important}
      #worksheetPreview{
        position:absolute;
        left:0;
        top:0;
        width:100% !important;
        min-height:0 !important;
        box-shadow:none !important;
        margin:0 !important;
      }
      @page{
        margin:10mm;
      }

    /*
      Traditional textbook cursive loader
      ------------------------------------
      Visual target: the clean, right-slanted school cursive used by
      CursiveAlphabet.cc worksheets. We do NOT copy their worksheet images.
      Instead, qLetter loads an open educational single-line cursive source
      (FRB American Cursive, GPL-3.0; Zaner–Bloser / D'Nealian / Palmer inspired)
      and converts its centerline splines into qLetter SVG practice strokes.

      The existing hand-built paths remain as an offline fallback. When the
      source finishes loading, all 52 cursive letters are replaced together.
    */
    const CURSIVE_SFD_URLS = [
      'https://cdn.jsdelivr.net/gh/ctrlcctrlv/FRBAmericanCursive@main/FRBAmericanCursive.sfd',
      'https://raw.githubusercontent.com/ctrlcctrlv/FRBAmericanCursive/main/FRBAmericanCursive.sfd'
    ];

    let cursiveModelReady = false;
    let cursiveModelLoading = true;

    function exactGlyphBlock(sfd, glyphName){
      const marker=`StartChar: ${glyphName}\n`;
      const start=sfd.indexOf(marker);
      if(start<0) throw new Error(`Missing cursive glyph: ${glyphName}`);
      const end=sfd.indexOf('\nEndChar',start);
      if(end<0) throw new Error(`Broken cursive glyph: ${glyphName}`);
      return sfd.slice(start,end);
    }

    function contourBox(contour){
      const pts=[];
      contour.commands.forEach(cmd=>{
        for(let i=0;i<cmd.values.length;i+=2){
          pts.push({x:cmd.values[i],y:cmd.values[i+1]});
        }
      });
      if(!pts.length) return {minX:0,maxX:0,minY:0,maxY:0,width:0,height:0};
      const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
      const minX=Math.min(...xs), maxX=Math.max(...xs);
      const minY=Math.min(...ys), maxY=Math.max(...ys);
      return {minX,maxX,minY,maxY,width:maxX-minX,height:maxY-minY};
    }

    function parseSfdGlyph(sfd,glyphName){
      const block=exactGlyphBlock(sfd,glyphName);
      const widthMatch=block.match(/\nWidth:\s*([-+]?\d+(?:\.\d+)?)/);
      const advance=widthMatch?Number(widthMatch[1]):600;

      const foreMarker='\nFore\nSplineSet\n';
      const foreStart=block.lastIndexOf(foreMarker);
      if(foreStart<0) throw new Error(`No foreground splines: ${glyphName}`);
      const dataStart=foreStart+foreMarker.length;
      const dataEnd=block.indexOf('\nEndSplineSet',dataStart);
      if(dataEnd<0) throw new Error(`No spline end: ${glyphName}`);

      const lines=block.slice(dataStart,dataEnd).split(/\r?\n/);
      const contours=[];
      let current=null;

      for(const raw of lines){
        const line=raw.trim();
        if(!line || line==='Spiro' || line==='EndSpiro' || line.includes('{') || line==='}') continue;
        const t=line.split(/\s+/);
        if(t.length<4) continue;
        const command=t[t.length-2];
        if(!['m','l','c'].includes(command)) continue;
        const nums=t.slice(0,t.length-2).map(Number);
        if(nums.some(v=>!Number.isFinite(v))) continue;

        if(command==='m'){
          current={commands:[]};
          contours.push(current);
          current.commands.push({type:'M',values:nums.slice(0,2)});
        }else if(current && command==='l'){
          current.commands.push({type:'L',values:nums.slice(0,2)});
        }else if(current && command==='c'){
          current.commands.push({type:'C',values:nums.slice(0,6)});
        }
      }

      let usable=contours.filter(c=>c.commands.length>1);
      if(!usable.length) throw new Error(`Empty cursive glyph: ${glyphName}`);

      // Teaching order: main body first, dot/crossbar afterwards.
      if(glyphName==='i' || glyphName==='j'){
        usable.sort((a,b)=>{
          const A=contourBox(a), B=contourBox(b);
          const aDot=A.height<90 && A.width<90 && A.minY>330;
          const bDot=B.height<90 && B.width<90 && B.minY>330;
          return Number(aDot)-Number(bDot);
        });
      }
      if(glyphName==='t' || glyphName==='F' || glyphName==='T'){
        usable.sort((a,b)=>{
          const A=contourBox(a), B=contourBox(b);
          const aBar=A.height<35 && A.width>80;
          const bBar=B.height<35 && B.width>80;
          return Number(aBar)-Number(bBar);
        });
      }

      const all=[];
      usable.forEach(c=>c.commands.forEach(cmd=>{
        for(let i=0;i<cmd.values.length;i+=2) all.push({x:cmd.values[i],y:cmd.values[i+1]});
      }));
      const minX=Math.min(...all.map(p=>p.x));
      const maxX=Math.max(...all.map(p=>p.x));

      // Common vertical scale keeps cap height, x-height and baseline consistent.
      // Very wide capitals are compressed only as much as needed to stay inside.
      const naturalWidth=Math.max(1,maxX-minX);
      const scaleY=.55;
      const scaleX=Math.min(.55,500/naturalWidth);
      const centerX=(minX+maxX)/2;
      const baselineY=430;

      function fmt(n){return Number(n.toFixed(2));}
      function tx(x){return fmt(300+(x-centerX)*scaleX);}
      function ty(y){return fmt(baselineY-y*scaleY);}

      return usable.map(contour=>{
        const d=[];
        contour.commands.forEach(cmd=>{
          const v=cmd.values;
          if(cmd.type==='M') d.push(`M ${tx(v[0])} ${ty(v[1])}`);
          else if(cmd.type==='L') d.push(`L ${tx(v[0])} ${ty(v[1])}`);
          else d.push(`C ${tx(v[0])} ${ty(v[1])} ${tx(v[2])} ${ty(v[3])} ${tx(v[4])} ${ty(v[5])}`);
        });
        return S(d.join(' '));
      });
    }

    async function fetchCursiveSfd(){
      let lastError=null;
      for(const url of CURSIVE_SFD_URLS){
        try{
          const r=await fetch(url,{mode:'cors',cache:'force-cache'});
          if(!r.ok) throw new Error(`${r.status} ${r.statusText}`);
          const sfd=await r.text();
          if(!sfd.includes('StartChar: A\n') || !sfd.includes('StartChar: z\n')){
            throw new Error('Unexpected cursive source format');
          }
          return sfd;
        }catch(err){lastError=err;}
      }
      throw lastError || new Error('Unable to load cursive source');
    }

    async function loadTraditionalCursive(){
      try{
        const sfd=await fetchCursiveSfd();
        const nextUpper={}, nextLower={};
        ABC.forEach(L=>{
          nextUpper[L]=parseSfdGlyph(sfd,L);
          nextLower[L.toLowerCase()]=parseSfdGlyph(sfd,L.toLowerCase());
        });
        Object.assign(cursiveUpper,nextUpper);
        Object.assign(cursiveLower,nextLower);
        cursiveModelReady=true;
        window.QLETTER_CURSIVE_MODEL={name:CURSIVE_MODEL,ready:true};
        if(style.startsWith('cursive')){
          strokeIndex=0;
          clearDrawing();
          render();
          document.getElementById('feedback').textContent=
            lang==='zh'?'已載入傳統美式教材草寫。':'Traditional textbook cursive loaded.';
        }
      }catch(err){
        console.warn('Traditional cursive source failed; using embedded fallback.',err);
        window.QLETTER_CURSIVE_MODEL={name:CURSIVE_MODEL,ready:false,error:String(err)};
      }finally{
        cursiveModelLoading=false;
      }
    }

    let lang='zh', style='printUpper', mode='watch', idx=0, strokeIndex=0;
    let points=[], drawing=false, timer=null;

    const guides=document.getElementById('guides');
    const demo=document.getElementById('demo');
    const markers=document.getElementById('markers');
    const canvas=document.getElementById('canvas');
    const ctx=canvas.getContext('2d');

    const label=()=>style.endsWith('Lower')?ABC[idx].toLowerCase():ABC[idx];

    function data(){
      const sets={printUpper,printLower,cursiveUpper,cursiveLower};
      return sets[style][label()];
    }

    const isCursive=()=>style.startsWith('cursive');

    function previewViewBox(key){
      if(isCursive()) return '20 10 560 590';
      if(style==='printUpper') return '70 55 460 500';

      // Lowercase previews preserve the school-writing zones while remaining
      // legible inside the compact letter buttons.
      if(key==='j') return '80 180 440 420';
      if('bdfhklt'.includes(key)) return '80 55 440 500';
      if('g pqy'.replace(/\s/g,'').includes(key)) return '80 250 440 350';
      if(key==='i') return '100 180 400 370';
      return '80 255 440 300';
    }

    function vectorPreviewSVG(strokes,key){
      const strokeWidth=isCursive()?10:30;
      const paths=strokes.map(s =>
        `<path d="${s.d}" fill="none" stroke="currentColor" stroke-width="${strokeWidth}" stroke-linecap="round" stroke-linejoin="round"/>`
      ).join('');
      return `<svg viewBox="${previewViewBox(key)}" role="img" aria-hidden="true">${paths}</svg>`;
    }


    function svgEl(tag,a){
      const e=document.createElementNS('http://www.w3.org/2000/svg',tag);
      Object.entries(a||{}).forEach(([k,v])=>e.setAttribute(k,v));
      return e;
    }

    const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

    function centerGlyphGroups(){
      const allPaths=[...guides.querySelectorAll('path'), ...demo.querySelectorAll('path')];
      if(!allPaths.length) return;

      let minX=Infinity,maxX=-Infinity;
      allPaths.forEach(p=>{
        const b=p.getBBox();
        if(!isFinite(b.x)) return;
        minX=Math.min(minX,b.x);
        maxX=Math.max(maxX,b.x+b.width);
      });

      if(!isFinite(minX)||!isFinite(maxX)) return;
      const dx=300-(minX+maxX)/2;
      [guides,demo,markers].forEach(g=>g.setAttribute('transform',`translate(${dx} 0)`));
    }

    /*
      重要修正：
      看筆順時，所有 i <= strokeIndex 的筆畫都保留。
      因此第 2 筆出現時，第 1 筆仍然存在；
      第 3 筆出現時，第 1、2 筆仍然存在。
    */
    function scene(){
      guides.innerHTML='';
      demo.innerHTML='';
      markers.innerHTML='';

      data().forEach((s,i)=>{
        const g=svgEl('path',{
          d:s.d,
          fill:'none',
          stroke:'rgba(255,255,255,.55)',
          'stroke-width':isCursive()?'10':'30',
          'stroke-linecap':'round',
          'stroke-linejoin':'round',
          opacity:mode==='free'?'.035':'.16'
        });
        guides.appendChild(g);

        const cumulativeVisible = mode==='watch' && i<=strokeIndex;
        const p=svgEl('path',{
          d:s.d,
          fill:'none',
          stroke:'var(--accent)',
          'stroke-width':isCursive()?'10':'30',
          'stroke-linecap':'round',
          'stroke-linejoin':'round',
          opacity:cumulativeVisible?'1':'0'
        });
        demo.appendChild(p);

        if(i===strokeIndex && mode!=='free'){
          const q=g.getPointAtLength(0);
          markers.appendChild(svgEl('circle',{
            cx:q.x,cy:q.y,r:'13',fill:'var(--accent)'
          }));
          const tx=svgEl('text',{
            x:q.x+20,y:q.y+6,fill:'white','font-size':'21','font-weight':'700'
          });
          tx.textContent=String(i+1);
          markers.appendChild(tx);
        }
      });

      centerGlyphGroups();
    }

    function buildAlphabet(){
      const bar=document.getElementById('alphabet');
      bar.innerHTML='';

      ABC.forEach((L,i)=>{
        const b=document.createElement('button');
        b.type='button';
        const key=style.endsWith('Lower')?L.toLowerCase():L;
        b.className='glass-btn alpha vector '+(i===idx?'active ':'')+(isCursive()?'cursive':'print');
        b.setAttribute('aria-label',key);
        const sets={printUpper,printLower,cursiveUpper,cursiveLower};
        b.innerHTML=vectorPreviewSVG(sets[style][key],key);
        b.addEventListener('click',e=>{
          if(alphabetMoved){
            e.preventDefault();
            e.stopPropagation();
            alphabetMoved=false;
            return;
          }

          idx=i;
          strokeIndex=0;
          clearDrawing();
          render();

          requestAnimationFrame(()=>{
            b.scrollIntoView({
              behavior:'smooth',
              block:'nearest',
              inline:'center'
            });
          });
        });
        bar.appendChild(b);
      });
    }


    function applyThemeUI(){
      const currentTheme=document.documentElement.getAttribute('data-theme') || 'dark';
      const themeToggle=document.getElementById('themeToggle');
      const darkHalf=themeToggle.querySelector('.theme-dark');
      const lightHalf=themeToggle.querySelector('.theme-light');
      const isLight=currentTheme==='light';

      themeToggle.classList.toggle('is-light',isLight);
      themeToggle.setAttribute('aria-pressed',String(isLight));
      themeToggle.setAttribute(
        'aria-label',
        isLight ? 'Switch to dark mode' : 'Switch to light mode'
      );
      darkHalf.classList.toggle('active',!isLight);
      lightHalf.classList.toggle('active',isLight);
    }

    function applyText(){
      document.getElementById('brandTitle').textContent=text[lang].brand;
      document.getElementById('brandSubtitle').textContent=text[lang].subtitle;
      document.querySelectorAll('.style-btn').forEach(b=>b.textContent=text[lang][b.dataset.style]);
      document.querySelectorAll('.mode').forEach(b=>b.textContent=text[lang][b.dataset.mode]);
      document.getElementById('currentLabel').textContent=text[lang].current;
      document.getElementById('prevStroke').textContent=text[lang].prev;
      document.getElementById('playAll').textContent=text[lang].play;
      document.getElementById('nextStroke').textContent=text[lang].next;
      document.getElementById('clearBtn').textContent=text[lang].clear;
      document.getElementById('footerNote').textContent=text[lang].footer;

      const langToggle=document.getElementById('langToggle');
      const zhHalf=langToggle.querySelector('.lang-zh');
      const enHalf=langToggle.querySelector('.lang-en');
      const isEnglish=lang==='en';
      langToggle.classList.toggle('is-en',isEnglish);
      langToggle.setAttribute('aria-pressed',String(isEnglish));
      langToggle.setAttribute(
        'aria-label',
        isEnglish ? 'Switch language to Chinese' : '切換語言為英文'
      );
      zhHalf.classList.toggle('active',!isEnglish);
      enHalf.classList.toggle('active',isEnglish);
    }

    function render(){
      const letterDisplay=document.getElementById('letterDisplay');
      letterDisplay.classList.add('vector');
      letterDisplay.classList.toggle('cursive',isCursive());
      letterDisplay.classList.toggle('print',!isCursive());
      letterDisplay.setAttribute('aria-label',label());
      letterDisplay.innerHTML=vectorPreviewSVG(data(),label());
      document.getElementById('strokeCount').textContent=text[lang].stroke(data().length);
      document.getElementById('descenderGuide').setAttribute('opacity',style.endsWith('Lower')?'1':'0');

      document.querySelectorAll('.style-btn').forEach(b=>b.classList.toggle('active',b.dataset.style===style));
      document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));

      document.getElementById('modeTitle').textContent=text[lang][mode];
      document.getElementById('modeStatus').textContent=text[lang][mode+'Status'];

      const watching=mode==='watch';
      document.getElementById('playAll').disabled=!watching;
      document.getElementById('prevStroke').disabled=!watching;
      document.getElementById('nextStroke').disabled=!watching;

      buildAlphabet();
      scene();
      requestAnimationFrame(revealSelectedLetter);
    }

    function clearDrawing(){
      ctx.clearRect(0,0,600,600);
      points=[];
      drawing=false;
      scene();
    }

    function pos(e){
      const r=canvas.getBoundingClientRect();
      return {
        x:(e.clientX-r.left)*600/r.width,
        y:(e.clientY-r.top)*600/r.height
      };
    }

    function currentPath(){return guides.children[strokeIndex]}

    function directionOK(path){
      if(points.length<4)return true;
      const L=path.getTotalLength();
      const a=path.getPointAtLength(0);
      const b=path.getPointAtLength(Math.min(65,L));
      const u0=points[0];
      const u1=points[Math.max(1,Math.floor(points.length*.2))];
      return ((b.x-a.x)*(u1.x-u0.x)+(b.y-a.y)*(u1.y-u0.y))>0;
    }

    function markStrokeComplete(fb){
      if(strokeIndex<data().length-1){
        fb.textContent=text[lang].sDone(strokeIndex+1);
        strokeIndex++;
        scene();
      }else{
        fb.textContent=text[lang].done(label());
      }
    }

    function evaluate(){
      const path=currentPath();
      if(!path||points.length<1)return;

      const L=path.getTotalLength();
      const st=path.getPointAtLength(0);
      const en=path.getPointAtLength(L);
      const fb=document.getElementById('feedback');

      // Dots on i and j are intentionally short strokes. A deliberate tap in
      // the correct start area completes them without forcing an artificial drag.
      if(L<12){
        if(dist(points[0],st)>70) fb.textContent=text[lang].wrongStart;
        else markStrokeComplete(fb);
        points=[];
        return;
      }

      if(points.length<3)return;

      let travel=0;
      for(let i=1;i<points.length;i++) travel+=dist(points[i-1],points[i]);

      if(dist(points[0],st)>70) fb.textContent=text[lang].wrongStart;
      else if(!directionOK(path)) fb.textContent=text[lang].wrongDir;
      else if(dist(points[points.length-1],en)>85) fb.textContent=text[lang].wrongEnd;
      else if(travel<L*.52) fb.textContent=text[lang].incomplete;
      else markStrokeComplete(fb);

      points=[];
    }

    canvas.addEventListener('pointerdown',e=>{
      if(mode==='watch')return;
      const path=currentPath();
      if(!path)return;

      const p=pos(e);
      const st=path.getPointAtLength(0);

      if(dist(p,st)>75){
        document.getElementById('feedback').textContent=text[lang].wrongStart;
        return;
      }

      drawing=true;
      points=[p];
      canvas.setPointerCapture(e.pointerId);

      if(path.getTotalLength()<12){
        ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#5b9cff';
        ctx.beginPath();
        ctx.arc(p.x,p.y,isCursive()?5:10,0,Math.PI*2);
        ctx.fill();
      }else{
        ctx.beginPath();
        ctx.moveTo(p.x,p.y);
      }
    });

    canvas.addEventListener('pointermove',e=>{
      if(!drawing)return;
      const p=pos(e);
      points.push(p);

      ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#5b9cff';
      ctx.lineWidth=isCursive()?9:23;
      ctx.lineCap='round';
      ctx.lineJoin='round';
      ctx.lineTo(p.x,p.y);
      ctx.stroke();
    });

    canvas.addEventListener('pointerup',()=>{
      if(!drawing)return;
      drawing=false;
      evaluate();
    });

    canvas.addEventListener('pointercancel',()=>{
      drawing=false;
      points=[];
    });

    /*
      累積播放：
      每一筆完成後不再消失。
    */
    function play(){
      clearTimeout(timer);
      strokeIndex=0;
      let i=0;

      function step(){
        if(i>=data().length){
          document.getElementById('feedback').textContent=text[lang].ready;
          return;
        }

        strokeIndex=i;
        scene();

        const p=demo.children[i];
        const L=p.getTotalLength();

        p.style.transition='none';
        p.style.strokeDasharray=L;
        p.style.strokeDashoffset=L;
        p.setAttribute('opacity','1');

        requestAnimationFrame(()=>{
          p.getBoundingClientRect();
          p.style.transition='stroke-dashoffset .75s ease';
          p.style.strokeDashoffset='0';
        });

        i++;
        timer=setTimeout(step,900);
      }

      step();
    }

    document.getElementById('langToggle').addEventListener('click',()=>{
      lang = lang==='zh' ? 'en' : 'zh';
      applyText();
      render();
    });

    document.getElementById('themeToggle').addEventListener('click',()=>{
      const currentTheme=document.documentElement.getAttribute('data-theme') || 'dark';
      const nextTheme=currentTheme==='dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme',nextTheme);
      localStorage.setItem('qletter-theme',nextTheme);
      applyThemeUI();
    });


    // A–Z 字母列：手機可直接左右滑；桌面可用滑鼠拖曳；
    // 滑鼠滾輪 / 觸控板垂直捲動在游標位於字母列時也會轉成水平捲動。
    const alphabetBar=document.getElementById('alphabet');
    let alphabetDragging=false;
    let alphabetStartX=0;
    let alphabetStartScroll=0;
    let alphabetMoved=false;

    alphabetBar.addEventListener('pointerdown',e=>{
      // 直接點字母 = 選字。
      // 只有左右拖曳超過 10px 才視為滑動。
      alphabetDragging=true;
      alphabetMoved=false;
      alphabetStartX=e.clientX;
      alphabetStartScroll=alphabetBar.scrollLeft;
      alphabetBar.classList.add('is-dragging');
    });

    alphabetBar.addEventListener('pointermove',e=>{
      if(!alphabetDragging)return;
      const dx=e.clientX-alphabetStartX;
      if(Math.abs(dx)>10) alphabetMoved=true;
      if(alphabetMoved){
        alphabetBar.scrollLeft=alphabetStartScroll-dx;
      }
    });

    const stopAlphabetDrag=e=>{
      if(!alphabetDragging)return;
      alphabetDragging=false;
      alphabetBar.classList.remove('is-dragging');

    };

    alphabetBar.addEventListener('pointerup',stopAlphabetDrag);
    alphabetBar.addEventListener('pointercancel',stopAlphabetDrag);
    alphabetBar.addEventListener('pointerleave',e=>{
      if(alphabetDragging && e.buttons===0) stopAlphabetDrag(e);
    });

    // 防止拖曳後誤觸某個字母。
    alphabetBar.addEventListener('click',e=>{
      if(alphabetMoved){
        e.preventDefault();
        e.stopPropagation();
        alphabetMoved=false;
      }
    },true);

    alphabetBar.addEventListener('wheel',e=>{
      if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){
        alphabetBar.scrollLeft += e.deltaY;
        e.preventDefault();
      }
    },{passive:false});

    function revealSelectedLetter(){
      const selected=alphabetBar.querySelector('.alpha.active');
      selected?.scrollIntoView({
        behavior:'smooth',
        block:'nearest',
        inline:'center'
      });
    }

    document.querySelectorAll('.style-btn').forEach(b=>b.addEventListener('click',()=>{
      style=b.dataset.style;
      strokeIndex=0;
      clearDrawing();
      render();
    }));

    document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>{
      mode=b.dataset.mode;
      strokeIndex=0;
      clearDrawing();
      render();
    }));

    document.getElementById('prevLetter').addEventListener('click',()=>{
      idx=(idx+25)%26;
      strokeIndex=0;
      clearDrawing();
      render();
    });

    document.getElementById('nextLetter').addEventListener('click',()=>{
      idx=(idx+1)%26;
      strokeIndex=0;
      clearDrawing();
      render();
    });

    document.getElementById('prevStroke').addEventListener('click',()=>{
      clearTimeout(timer);
      strokeIndex=Math.max(0,strokeIndex-1);
      scene();
    });

    document.getElementById('nextStroke').addEventListener('click',()=>{
      clearTimeout(timer);
      strokeIndex=Math.min(data().length-1,strokeIndex+1);
      scene();
    });

    document.getElementById('playAll').addEventListener('click',play);

    document.getElementById('clearBtn').addEventListener('click',()=>{
      clearTimeout(timer);
      strokeIndex=0;
      clearDrawing();
      document.getElementById('feedback').textContent=text[lang].ready;
    });


    // ===== Worksheet Builder =====
    const worksheetPanel=document.getElementById('worksheetPanel');
    const worksheetBtn=document.getElementById('worksheetBtn');
    const worksheetClose=document.getElementById('worksheetClose');
    const wsLetterPicker=document.getElementById('wsLetterPicker');
    const wsStyle=document.getElementById('wsStyle');
    const wsMode=document.getElementById('wsMode');
    const wsRows=document.getElementById('wsRows');
    const wsPaper=document.getElementById('wsPaper');
    const wsTitleInput=document.getElementById('wsTitleInput');
    const wsShowName=document.getElementById('wsShowName');
    const wsShowDate=document.getElementById('wsShowDate');
    const worksheetPreview=document.getElementById('worksheetPreview');

    let wsSelected=new Set(['A','B','C','D','E','F']);

    function wsLettersForStyle(){
      return styleToLetters(wsStyle.value);
    }

    function styleToLetters(styleName){
      return styleName.endsWith('Lower')
        ? ABC.map(x=>x.toLowerCase())
        : ABC.slice();
    }

    function renderWsPicker(){
      const letters=wsLettersForStyle();
      const valid=new Set(letters);
      wsSelected=new Set([...wsSelected].filter(x=>valid.has(x)));

      if(wsSelected.size===0){
        letters.slice(0,6).forEach(x=>wsSelected.add(x));
      }

      wsLetterPicker.innerHTML='';
      letters.forEach(letter=>{
        const btn=document.createElement('button');
        btn.type='button';
        btn.className='ws-letter-chip'+(wsSelected.has(letter)?' active':'');
        btn.textContent=letter;
        btn.addEventListener('click',()=>{
          if(wsSelected.has(letter)) wsSelected.delete(letter);
          else wsSelected.add(letter);
          btn.classList.toggle('active',wsSelected.has(letter));
        });
        wsLetterPicker.appendChild(btn);
      });
    }

    function openWorksheet(){
      worksheetPanel.hidden=false;
      document.body.style.overflow='hidden';
      renderWsPicker();
      generateWorksheet();
    }

    function closeWorksheet(){
      worksheetPanel.hidden=true;
      document.body.style.overflow='';
    }

    worksheetBtn.addEventListener('click',openWorksheet);
    worksheetClose.addEventListener('click',closeWorksheet);
    worksheetPanel.querySelectorAll('[data-close-worksheet]').forEach(el=>{
      el.addEventListener('click',closeWorksheet);
    });

    document.addEventListener('keydown',e=>{
      if(e.key==='Escape' && !worksheetPanel.hidden) closeWorksheet();
    });

    wsStyle.addEventListener('change',renderWsPicker);

    document.getElementById('wsSelectAll').addEventListener('click',()=>{
      wsSelected=new Set(wsLettersForStyle());
      renderWsPicker();
    });

    document.getElementById('wsClearAll').addEventListener('click',()=>{
      wsSelected.clear();
      renderWsPicker();
    });

    function wsCharHTML(letter,mode){
      if(mode==='trace'){
        return `<span class="ws-model-char trace">${letter}</span>`.repeat(6);
      }
      if(mode==='copy'){
        return `<span class="ws-model-char">${letter}</span><span class="ws-model-char copy-fade">${letter}</span><span class="ws-free-space"></span>`;
      }
      if(mode==='free'){
        return `<span class="ws-model-char">${letter}</span><span class="ws-free-space"></span>`;
      }
      return `<span class="ws-model-char trace">${letter}</span><span class="ws-model-char trace">${letter}</span><span class="ws-model-char">${letter}</span><span class="ws-free-space"></span>`;
    }

    function generateWorksheet(){
      const letters=[...wsSelected];
      if(letters.length===0){
        worksheetPreview.innerHTML='<div class="ws-placeholder">請至少選擇一個字母</div>';
        return;
      }

      worksheetPreview.classList.toggle('letter-paper',wsPaper.value==='letter');

      let content=`<div class="ws-sheet-title">${escapeHtml(wsTitleInput.value || 'English Letter Practice')}</div>`;

      if(wsShowName.checked || wsShowDate.checked){
        content+='<div class="ws-meta">';
        if(wsShowName.checked) content+='<div class="ws-meta-line">Name:</div>';
        if(wsShowDate.checked) content+='<div class="ws-meta-line">Date:</div>';
        content+='</div>';
      }

      const rows=Math.max(1,Math.min(3,Number(wsRows.value)||2));
      letters.forEach(letter=>{
        content+=`<div class="ws-practice-block"><div class="ws-practice-label">${letter}</div>`;
        for(let r=0;r<rows;r++){
          content+=`<div class="ws-line"><div class="ws-models">${wsCharHTML(letter,wsMode.value)}</div></div>`;
        }
        content+='</div>';
      });

      worksheetPreview.innerHTML=content;
    }

    function escapeHtml(value){
      return String(value).replace(/[&<>"']/g,ch=>({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
      }[ch]));
    }

    document.getElementById('wsGenerate').addEventListener('click',generateWorksheet);
    document.getElementById('wsPrint').addEventListener('click',()=>{
      generateWorksheet();
      setTimeout(()=>window.print(),80);
    });

    applyText();
    applyThemeUI();
    render();
    loadTraditionalCursive();
  })();
  </script>
</body>
</html>
