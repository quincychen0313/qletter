<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>英文字母書寫練習</title>
  <meta name="description" content="中英文雙語英文字母書寫練習，包含印刷體大小寫與草寫大小寫。" />
  <style>
    :root{
      --bg:#090a0c;
      --panel:rgba(255,255,255,.055);
      --panel2:rgba(255,255,255,.025);
      --text:#f7f8fb;
      --muted:#9aa1ad;
      --border:rgba(255,255,255,.09);
      --accent:#5b9cff;
      --accent-bg:rgba(59,130,246,.20);
      --danger:#ff6b6b;
      --success:#64d98b;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",Arial,sans-serif;
    }

    body{
      min-height:100vh;
      margin:0;
      padding:0;
      overflow:auto;
      background:var(--bg);
      text-align:left;
    }

    /* 真正的 CSS RWD：最大 390px、永遠靠左、不使用 transform 縮放 */
    .viewport-fit{
      position:relative;
      width:min(390px,100vw);
      max-width:390px;
      min-width:0;
      margin:0;
      padding:0;
      overflow:visible;
    }

    .scale-stage{
      width:100%;
      max-width:390px;
      min-width:0;
      margin:0;
      padding:0;
      transform:none !important;
    }

    .app{
      width:100%;
      max-width:390px;
      min-width:0;
      margin:0;
      padding:10px;
      display:grid;
      gap:10px;
    }

    button{font:inherit;color:inherit}

    .glass-shell{
      border:1px solid var(--border);
      border-radius:24px;
      background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));
      backdrop-filter:blur(20px) saturate(155%);
      -webkit-backdrop-filter:blur(20px) saturate(155%);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 12px 32px rgba(0,0,0,.18);
    }

    .glass-btn{
      position:relative;
      min-height:38px;
      border:1px solid rgba(255,255,255,.14);
      border-radius:999px;
      padding:0 18px;
      color:var(--text);
      font-weight:700;
      background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
      backdrop-filter:blur(18px) saturate(160%);
      -webkit-backdrop-filter:blur(18px) saturate(160%);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 22px rgba(0,0,0,.13);
      transition:transform .16s ease,border-color .16s ease,background .16s ease;
      cursor:pointer;
    }

    .glass-btn::before{
      content:"";
      position:absolute;
      left:14px;right:14px;top:5px;height:34%;
      border-radius:999px;
      background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,0));
      pointer-events:none;
    }

    .glass-btn:active{transform:scale(.98)}
    .glass-btn.active,.primary{
      border-color:rgba(74,142,255,.8);
      background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05)),var(--accent-bg);
    }
    .glass-btn:disabled{opacity:.35;cursor:not-allowed;transform:none}

    .topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
    .brand{font-size:clamp(20px,5.6vw,26px);font-weight:800;letter-spacing:-.03em}
    .subtitle{color:var(--muted);font-size:13px;margin-top:4px}
    .lang-switch{display:inline-flex;padding:4px;border-radius:999px}
    .lang{min-height:38px;padding:0 14px}

    .styles{display:grid;grid-template-columns:repeat(2,max-content);justify-content:start;align-items:center;gap:8px}
    .style-btn{width:auto;min-width:0;min-height:38px;border-radius:999px;padding:0 14px;font-size:13px;white-space:nowrap}

    .letter-card{padding:12px}
    .letter-main{display:flex;align-items:center;justify-content:space-between;gap:16px}
    .nav{width:clamp(42px,12vw,48px);height:clamp(42px,12vw,48px);min-height:0;padding:0;font-size:clamp(1.35rem,6vw,1.65rem);line-height:1;flex:0 0 auto}
    .center{text-align:center;min-width:0}
    .current-label{font-size:12px;color:var(--muted)}
    .letter-display{font-size:clamp(42px,12vw,52px);line-height:1;font-weight:700;margin-top:5px}
    .letter-display.cursive{
      font-family:"Snell Roundhand","Apple Chancery","Segoe Script","Brush Script MT",cursive;
      font-size:clamp(54px,16vw,66px);
      font-weight:500;
    }

    .count{margin-top:8px;font-size:14px;color:var(--muted)}
    .alphabet{display:flex;gap:clamp(6px,2vw,8px);overflow-x:auto;padding-top:14px;padding-bottom:4px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
    .alpha{min-width:40px;width:40px;height:38px;min-height:38px;flex:0 0 auto;padding:0 6px;font-size:13px}
    .alpha.cursive{
      font-family:"Snell Roundhand","Apple Chancery","Segoe Script","Brush Script MT",cursive;
      font-size:1.55rem;
      font-weight:500;
    }

    .modes{display:grid;grid-template-columns:repeat(3,max-content);justify-content:start;align-items:center;gap:8px}
    .mode{width:auto;min-width:0;min-height:38px;border-radius:999px;padding:0 15px;font-size:13px;white-space:nowrap}

    .practice{padding:12px;display:flex;flex-direction:column;align-items:center}
    .practice > .title,.practice > .status,.practice > .feedback-row{width:100%}
    .practice > .status{margin-bottom:2px}
    .stroke-controls,.board{align-self:center}
    .title{font-size:16px;font-weight:700}
    .status{color:var(--muted);font-size:14px;margin-top:4px}

    .stroke-controls{
      display:flex;
      justify-content:center;
      gap:8px;
      flex-wrap:wrap;
      margin:12px 0;
      width:auto;
      max-width:100%;
    }

    .stroke-control{width:auto;min-width:88px;flex:0 0 auto;min-height:38px;padding:0 14px;font-size:13px;white-space:nowrap}

    .board{
      position:relative;
      width:100%;
      max-width:330px;
      aspect-ratio:1/1;
      margin:0 auto;
      overflow:hidden;
      border-radius:20px;
      border:1px solid var(--border);
      background:var(--panel2);
      touch-action:none;
    }

    .board svg,.board canvas{position:absolute;inset:0;width:100%;height:100%}
    .feedback-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px}
    .feedback{font-size:14px;min-height:22px}
    .clear{min-height:clamp(38px,10.5vw,42px);padding:0 clamp(10px,3vw,14px);font-size:clamp(.76rem,3.4vw,.9rem)}
    .footer-note{text-align:center;color:var(--muted);font-size:12px;padding:6px 0 12px}

    @media (max-width:340px){
      .app{padding:8px;gap:8px}
      .topbar{gap:8px}
      .subtitle{font-size:12px}
      .lang-switch{padding:3px}
      .lang{min-height:34px;padding:0 10px;font-size:.82rem}
      .styles{grid-template-columns:repeat(2,max-content);gap:6px}
      .style-btn{min-height:36px;padding:0 11px;font-size:12px}
      .letter-card{padding:10px}
      .letter-main{gap:10px}
      .modes{grid-template-columns:repeat(3,max-content);gap:5px}
      .mode{min-height:36px;padding:0 11px;font-size:12px}
      .practice{padding:10px}
      .stroke-controls{gap:6px;margin:10px 0}
      .stroke-control{min-width:78px;min-height:36px;padding:0 10px;font-size:12px}
      .feedback-row{gap:8px;margin-top:10px}
    }

    @media (max-width:300px){
      .styles{grid-template-columns:max-content}
      .modes{display:flex;flex-wrap:wrap;justify-content:flex-start}
      .stroke-controls{justify-content:flex-start}
    }
  
    /* ===== Critical grid overflow fix =====
       The 26-letter horizontal strip must scroll inside 390px; it must not
       enlarge the CSS grid's implicit column to its full intrinsic width. */
    .app{
      grid-template-columns:minmax(0, 1fr) !important;
      overflow:hidden;
    }

    .app > *,
    .topbar,
    .styles,
    .letter-card,
    .letter-main,
    .alphabet,
    .modes,
    .practice,
    .stroke-controls,
    .feedback-row{
      min-width:0;
      max-width:100%;
    }

    .letter-card,
    .practice{
      width:100%;
    }

    .alphabet{
      width:100%;
      overflow-x:auto;
      overflow-y:hidden;
      contain:inline-size;
    }

    .styles,
    .modes{
      width:max-content;
      justify-self:start;
    }

    @media (max-width:340px){
      .styles,
      .modes{
        width:100%;
      }
    }

  

    /* ===== Fluid viewport layout final ===== */
    /*
      The application now uses the full browser viewport.
      It changes from one column to two columns according to available width,
      while buttons remain compact instead of being enlarged with the page.
    */
    :root{
      --page-pad:clamp(8px,1.2vw,20px);
      --section-gap:clamp(8px,.9vw,14px);
      --compact-h:clamp(36px,2.6vw,42px);
      --compact-font:clamp(12px,.85vw,14px);
    }

    html,body{
      width:100%;
      max-width:100%;
      min-width:0;
      overflow-x:hidden;
    }

    body{min-height:100dvh}

    .viewport-fit,
    .scale-stage{
      width:100% !important;
      max-width:none !important;
      min-width:0 !important;
      height:auto !important;
      margin:0 !important;
      padding:0 !important;
      transform:none !important;
      overflow:visible !important;
    }

    .app{
      width:100% !important;
      max-width:none !important;
      min-width:0 !important;
      margin:0 !important;
      padding:var(--page-pad) !important;
      gap:var(--section-gap) !important;
      display:grid !important;
      grid-template-columns:minmax(0,1fr) !important;
      grid-template-areas:
        "header"
        "styles"
        "letters"
        "modes"
        "practice"
        "footer";
      align-items:start;
      overflow:visible !important;
    }

    .topbar{grid-area:header}
    .styles{grid-area:styles}
    .letter-card{grid-area:letters}
    .modes{grid-area:modes}
    .practice{grid-area:practice}
    .footer-note{grid-area:footer}

    .styles,
    .modes{
      display:flex !important;
      flex-wrap:wrap;
      align-items:center;
      justify-content:flex-start !important;
      width:auto !important;
      max-width:100% !important;
      gap:clamp(6px,.7vw,10px) !important;
      justify-self:start;
    }

    .style-btn,
    .mode,
    .stroke-control{
      width:auto !important;
      min-width:0 !important;
      min-height:var(--compact-h) !important;
      padding:0 clamp(11px,1vw,16px) !important;
      border-radius:999px !important;
      font-size:var(--compact-font) !important;
      line-height:1 !important;
      white-space:nowrap;
      flex:0 0 auto !important;
    }

    .stroke-controls{
      display:flex !important;
      flex-wrap:wrap;
      align-items:center;
      justify-content:center !important;
      width:auto !important;
      max-width:100% !important;
      gap:clamp(6px,.7vw,10px) !important;
      margin:clamp(10px,1vw,14px) auto !important;
      align-self:center;
    }

    .letter-card,
    .practice{
      width:100% !important;
      max-width:none !important;
      min-width:0;
    }

    .letter-card{padding:clamp(10px,1vw,16px)}
    .practice{padding:clamp(10px,1.1vw,18px)}

    .alphabet{
      width:100% !important;
      max-width:100% !important;
      min-width:0;
      overflow-x:auto;
      overflow-y:hidden;
      contain:inline-size;
    }

    /* One-column phones/tablets use most of the available screen width. */
    .board{
      width:min(100%,88vmin,760px) !important;
      max-width:none !important;
      margin-inline:auto !important;
    }

    .feedback-row{
      max-width:900px;
      margin-inline:auto;
    }

    /* Landscape tablets and desktops become a fluid two-column workspace. */
    @media (min-width:900px){
      .app{
        grid-template-columns:minmax(300px,36%) minmax(0,1fr) !important;
        grid-template-areas:
          "header header"
          "styles modes"
          "letters practice"
          "footer footer";
      }

      .letter-card{align-self:start}
      .practice{min-height:calc(100dvh - 150px)}
      .board{width:min(100%,clamp(360px,52vmin,760px)) !important}
    }

    @media (min-width:1180px){
      .app{grid-template-columns:minmax(330px,430px) minmax(0,1fr) !important}
      .board{width:min(100%,clamp(430px,56vmin,820px)) !important}
    }

    @media (min-width:1800px){
      .app{grid-template-columns:minmax(380px,500px) minmax(0,1fr) !important}
      .board{width:min(100%,clamp(520px,52vmin,900px)) !important}
    }

    @media (max-width:420px){
      .topbar{gap:8px}
      .styles,.modes{width:100% !important}
      .style-btn,.mode{padding-inline:10px !important}
      .stroke-controls{width:100% !important}
      .stroke-control{
        flex:1 1 0 !important;
        min-width:82px !important;
        padding-inline:6px !important;
      }
      .board{width:100% !important}
    }

  </style>
</head>

<body>
  <div id="viewportFit" class="viewport-fit">
    <div id="scaleStage" class="scale-stage">
      <main class="app" id="app">
        <section class="topbar">
          <div>
            <div class="brand" id="brandTitle">英文字母書寫練習</div>
            <div class="subtitle" id="brandSubtitle">印刷體、草寫、大小寫與筆順練習</div>
          </div>
          <div class="glass-shell lang-switch">
            <button type="button" class="glass-btn lang active" data-lang="zh">中文</button>
            <button type="button" class="glass-btn lang" data-lang="en">English</button>
          </div>
        </section>

        <section class="styles">
          <button type="button" class="glass-btn style-btn active" data-style="printUpper">印刷體大寫</button>
          <button type="button" class="glass-btn style-btn" data-style="printLower">印刷體小寫</button>
          <button type="button" class="glass-btn style-btn" data-style="cursiveUpper">草寫大寫</button>
          <button type="button" class="glass-btn style-btn" data-style="cursiveLower">草寫小寫</button>
        </section>

        <section class="glass-shell letter-card">
          <div class="letter-main">
            <button id="prevLetter" class="glass-btn nav" type="button" aria-label="上一個字母">‹</button>
            <div class="center">
              <div id="currentLabel" class="current-label">目前字母</div>
              <div id="letterDisplay" class="letter-display">A</div>
              <div id="strokeCount" class="count">3 筆</div>
            </div>
            <button id="nextLetter" class="glass-btn nav" type="button" aria-label="下一個字母">›</button>
          </div>
          <div id="alphabet" class="alphabet"></div>
        </section>

        <section class="modes">
          <button type="button" class="glass-btn mode active" data-mode="watch">看筆順</button>
          <button type="button" class="glass-btn mode" data-mode="trace">跟著寫</button>
          <button type="button" class="glass-btn mode" data-mode="free">自己寫</button>
        </section>

        <section class="glass-shell practice">
          <div class="title" id="modeTitle">看筆順</div>
          <div class="status" id="modeStatus">用下方按鍵逐筆查看或播放全部。</div>

          <div class="stroke-controls">
            <button id="prevStroke" class="glass-btn stroke-control" type="button">上一筆</button>
            <button id="playAll" class="glass-btn stroke-control primary" type="button">播放全部</button>
            <button id="nextStroke" class="glass-btn stroke-control" type="button">下一筆</button>
          </div>

          <div class="board">
            <svg viewBox="0 0 600 600" aria-label="字母練習區">
              <line x1="35" y1="80" x2="565" y2="80" stroke="rgba(255,255,255,.12)" stroke-width="2"/>
              <line x1="35" y1="295" x2="565" y2="295" stroke="rgba(255,255,255,.12)" stroke-width="2" stroke-dasharray="8 8"/>
              <line x1="35" y1="510" x2="565" y2="510" stroke="rgba(255,255,255,.12)" stroke-width="3"/>
              <g id="guides"></g>
              <g id="demo"></g>
              <g id="markers"></g>
            </svg>
            <canvas id="canvas" width="600" height="600"></canvas>
          </div>

          <div class="feedback-row">
            <div id="feedback" class="feedback" aria-live="polite">準備好了。</div>
            <button id="clearBtn" class="glass-btn clear" type="button">清除重寫</button>
          </div>
        </section>

        <div class="footer-note" id="footerNote">書寫練習會檢查起筆位置、方向、順序與完整度。</div>
      </main>
    </div>
  </div>

  <!-- 正式印刷體 52 字母筆順資料庫：已內嵌，無需外部 JS 檔 -->

    s: ["M410 290 C375 255 315 245 265 260 C215 275 195 310 210 340 C225 370 270 375 325 385 C390 395 420 425 405 455 C385 495 315 505 255 485 C225 475 205 460 190 440"],
    t: ["M300 145 L300 430 C300 475 330 495 375 485", "M215 275 L385 275"],
    u: ["M180 275 L180 410 C180 470 225 500 280 495 C340 490 385 450 405 395", "M405 275 L405 475"],
    v: ["M170 275 L300 475", "M300 475 L430 275"],
    w: ["M125 275 L215 475", "M215 475 L300 325", "M300 325 L385 475", "M385 475 L475 275"],
    x: ["M180 275 L420 475", "M420 275 L180 475"],
    y: ["M170 275 L300 475", "M430 275 L295 515 C265 565 235 585 200 575"],
    z: ["M180 275 L420 275", "M420 275 L180 475", "M180 475 L420 475"]
  }
};

if (typeof window !== "undefined") window.QLETTER_PRINT_STROKES = QLETTER_PRINT_STROKES;
if (typeof module !== "undefined" && module.exports) module.exports = QLETTER_PRINT_STROKES;

</script>

  <script>
  (() => {
    const ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    const S = d => ({d});

    const text = {
      zh:{
        brand:'英文字母書寫練習',
        subtitle:'印刷體、草寫、大小寫與筆順練習',
        printUpper:'印刷體大寫', printLower:'印刷體小寫',
        cursiveUpper:'草寫大寫', cursiveLower:'草寫小寫',
        watch:'看筆順', trace:'跟著寫', free:'自己寫',
        current:'目前字母', prev:'上一筆', play:'播放全部', next:'下一筆',
        clear:'清除重寫', ready:'準備好了。',
        stroke:n=>n+' 筆',
        watchStatus:'用下方按鍵逐筆查看或播放全部。前面的筆畫會保留。',
        traceStatus:'沿著提示完整書寫，系統會監督起筆、方向、順序與完整度。',
        freeStatus:'提示淡化，但仍會監督起筆、方向、順序與完整度。',
        done:l=>'✓ '+l+' 完成。',
        sDone:n=>'✓ 第 '+n+' 筆完成。',
        wrongStart:'✕ 起筆位置錯誤。',
        wrongDir:'✕ 書寫方向錯誤。',
        wrongEnd:'✕ 沒有到達正確終點。',
        incomplete:'✕ 筆畫沒有完整寫完。',
        footer:'書寫練習會檢查起筆位置、方向、順序與完整度。'
      },
      en:{
        brand:'English Letter Writing Practice',
        subtitle:'Print, cursive, uppercase, lowercase, and stroke-order practice',
        printUpper:'Print Uppercase', printLower:'Print Lowercase',
        cursiveUpper:'Cursive Uppercase', cursiveLower:'Cursive Lowercase',
        watch:'Stroke Order', trace:'Trace', free:'Write by Yourself',
        current:'Current Letter', prev:'Previous Stroke', play:'Play All', next:'Next Stroke',
        clear:'Clear & Retry', ready:'Ready.',
        stroke:n=>n+(n===1?' stroke':' strokes'),
        watchStatus:'View each stroke or play all. Earlier strokes remain visible.',
        traceStatus:'Trace the guide. Starting point, direction, order, and completeness are checked.',
        freeStatus:'The guide is faded, but starting point, direction, order, and completeness are still checked.',
        done:l=>'✓ '+l+' completed.',
        sDone:n=>'✓ Stroke '+n+' completed.',
        wrongStart:'✕ Incorrect starting point.',
        wrongDir:'✕ Incorrect stroke direction.',
        wrongEnd:'✕ The stroke did not reach the correct endpoint.',
        incomplete:'✕ The stroke is incomplete.',
        footer:'Writing practice checks starting point, direction, order, and completeness.'
      }
    };

    if(!window.QLETTER_PRINT_STROKES){
      document.body.innerHTML = '<div style="padding:24px;color:white">筆順資料庫載入失敗：請確認 qletter-print-strokes-v1.js 與 index.html 在同一層。</div>';
      return;
    }

    const printUpper = Object.fromEntries(
      Object.entries(window.QLETTER_PRINT_STROKES.upper).map(([k,paths]) => [k, paths.map(S)])
    );
    const printLower = Object.fromEntries(
      Object.entries(window.QLETTER_PRINT_STROKES.lower).map(([k,paths]) => [k, paths.map(S)])
    );

    /* 草寫目前維持舊版骨架，下一階段會逐字替換成正式教學路徑。 */
    const cursiveUpper = {};
    const cursiveLower = {};
    ABC.forEach((L,i)=>{
      const x = 165 + (i%3)*12;
      cursiveUpper[L] = [S(`M${x} 500 C${x-15} 360 ${x+20} 210 ${x+70} 100 C${x+130} 180 ${x+150} 330 ${x+120} 500`)];
      cursiveLower[L.toLowerCase()] = [S(`M${x} 465 C${x+20} 300 ${x+85} 235 ${x+145} 285 C${x+190} 335 ${x+170} 430 ${x+115} 465`)];
    });

    let lang='zh', style='printUpper', mode='watch', idx=0, strokeIndex=0;
    let points=[], drawing=false, timer=null;

    const guides=document.getElementById('guides');
    const demo=document.getElementById('demo');
    const markers=document.getElementById('markers');
    const canvas=document.getElementById('canvas');
    const ctx=canvas.getContext('2d');

    const label=()=>style.endsWith('Lower')?ABC[idx].toLowerCase():ABC[idx];

    function data(){
      const sets={printUpper,printLower,cursiveUpper,cursiveLower};
      return sets[style][label()];
    }

    const isCursive=()=>style.startsWith('cursive');

    function svgEl(tag,a){
      const e=document.createElementNS('http://www.w3.org/2000/svg',tag);
      Object.entries(a||{}).forEach(([k,v])=>e.setAttribute(k,v));
      return e;
    }

    const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

    function centerGlyphGroups(){
      const allPaths=[...guides.querySelectorAll('path'), ...demo.querySelectorAll('path')];
      if(!allPaths.length) return;

      let minX=Infinity,maxX=-Infinity;
      allPaths.forEach(p=>{
        const b=p.getBBox();
        if(!isFinite(b.x)) return;
        minX=Math.min(minX,b.x);
        maxX=Math.max(maxX,b.x+b.width);
      });

      if(!isFinite(minX)||!isFinite(maxX)) return;
      const dx=300-(minX+maxX)/2;
      [guides,demo,markers].forEach(g=>g.setAttribute('transform',`translate(${dx} 0)`));
    }

    /*
      重要修正：
      看筆順時，所有 i <= strokeIndex 的筆畫都保留。
      因此第 2 筆出現時，第 1 筆仍然存在；
      第 3 筆出現時，第 1、2 筆仍然存在。
    */
    function scene(){
      guides.innerHTML='';
      demo.innerHTML='';
      markers.innerHTML='';

      data().forEach((s,i)=>{
        const g=svgEl('path',{
          d:s.d,
          fill:'none',
          stroke:'rgba(255,255,255,.55)',
          'stroke-width':isCursive()?'14':'18',
          'stroke-linecap':'round',
          'stroke-linejoin':'round',
          opacity:mode==='free'?'.035':'.16'
        });
        guides.appendChild(g);

        const cumulativeVisible = mode==='watch' && i<=strokeIndex;
        const p=svgEl('path',{
          d:s.d,
          fill:'none',
          stroke:'var(--accent)',
          'stroke-width':isCursive()?'14':'18',
          'stroke-linecap':'round',
          'stroke-linejoin':'round',
          opacity:cumulativeVisible?'1':'0'
        });
        demo.appendChild(p);

        if(i===strokeIndex && mode!=='free'){
          const q=g.getPointAtLength(0);
          markers.appendChild(svgEl('circle',{
            cx:q.x,cy:q.y,r:'13',fill:'var(--accent)'
          }));
          const tx=svgEl('text',{
            x:q.x+20,y:q.y+6,fill:'white','font-size':'21','font-weight':'700'
          });
          tx.textContent=String(i+1);
          markers.appendChild(tx);
        }
      });

      centerGlyphGroups();
    }

    function buildAlphabet(){
      const bar=document.getElementById('alphabet');
      bar.innerHTML='';

      ABC.forEach((L,i)=>{
        const b=document.createElement('button');
        b.type='button';
        b.className='glass-btn alpha '+(i===idx?'active ':'')+(isCursive()?'cursive':'');
        b.textContent=style.endsWith('Lower')?L.toLowerCase():L;
        b.addEventListener('click',()=>{
          idx=i;
          strokeIndex=0;
          clearDrawing();
          render();
        });
        bar.appendChild(b);
      });
    }

    function applyText(){
      document.getElementById('brandTitle').textContent=text[lang].brand;
      document.getElementById('brandSubtitle').textContent=text[lang].subtitle;
      document.querySelectorAll('.style-btn').forEach(b=>b.textContent=text[lang][b.dataset.style]);
      document.querySelectorAll('.mode').forEach(b=>b.textContent=text[lang][b.dataset.mode]);
      document.getElementById('currentLabel').textContent=text[lang].current;
      document.getElementById('prevStroke').textContent=text[lang].prev;
      document.getElementById('playAll').textContent=text[lang].play;
      document.getElementById('nextStroke').textContent=text[lang].next;
      document.getElementById('clearBtn').textContent=text[lang].clear;
      document.getElementById('footerNote').textContent=text[lang].footer;
      document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
    }

    function render(){
      document.getElementById('letterDisplay').textContent=label();
      document.getElementById('letterDisplay').classList.toggle('cursive',isCursive());
      document.getElementById('strokeCount').textContent=text[lang].stroke(data().length);

      document.querySelectorAll('.style-btn').forEach(b=>b.classList.toggle('active',b.dataset.style===style));
      document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));

      document.getElementById('modeTitle').textContent=text[lang][mode];
      document.getElementById('modeStatus').textContent=text[lang][mode+'Status'];

      const watching=mode==='watch';
      document.getElementById('playAll').disabled=!watching;
      document.getElementById('prevStroke').disabled=!watching;
      document.getElementById('nextStroke').disabled=!watching;

      buildAlphabet();
      scene();
    }

    function clearDrawing(){
      ctx.clearRect(0,0,600,600);
      points=[];
      drawing=false;
      scene();
    }

    function pos(e){
      const r=canvas.getBoundingClientRect();
      return {
        x:(e.clientX-r.left)*600/r.width,
        y:(e.clientY-r.top)*600/r.height
      };
    }

    function currentPath(){return guides.children[strokeIndex]}

    function directionOK(path){
      if(points.length<4)return true;
      const L=path.getTotalLength();
      const a=path.getPointAtLength(0);
      const b=path.getPointAtLength(Math.min(65,L));
      const u0=points[0];
      const u1=points[Math.max(1,Math.floor(points.length*.2))];
      return ((b.x-a.x)*(u1.x-u0.x)+(b.y-a.y)*(u1.y-u0.y))>0;
    }

    function evaluate(){
      const path=currentPath();
      if(!path||points.length<3)return;

      const L=path.getTotalLength();
      const st=path.getPointAtLength(0);
      const en=path.getPointAtLength(L);
      let travel=0;

      for(let i=1;i<points.length;i++) travel+=dist(points[i-1],points[i]);

      const fb=document.getElementById('feedback');

      if(dist(points[0],st)>70) fb.textContent=text[lang].wrongStart;
      else if(!directionOK(path)) fb.textContent=text[lang].wrongDir;
      else if(dist(points[points.length-1],en)>85) fb.textContent=text[lang].wrongEnd;
      else if(travel<L*.52) fb.textContent=text[lang].incomplete;
      else if(strokeIndex<data().length-1){
        fb.textContent=text[lang].sDone(strokeIndex+1);
        strokeIndex++;
        scene();
      }else{
        fb.textContent=text[lang].done(label());
      }

      points=[];
    }

    canvas.addEventListener('pointerdown',e=>{
      if(mode==='watch')return;
      const path=currentPath();
      if(!path)return;

      const p=pos(e);
      const st=path.getPointAtLength(0);

      if(dist(p,st)>75){
        document.getElementById('feedback').textContent=text[lang].wrongStart;
        return;
      }

      drawing=true;
      points=[p];
      canvas.setPointerCapture(e.pointerId);
      ctx.beginPath();
      ctx.moveTo(p.x,p.y);
    });

    canvas.addEventListener('pointermove',e=>{
      if(!drawing)return;
      const p=pos(e);
      points.push(p);

      ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#5b9cff';
      ctx.lineWidth=isCursive()?11:13;
      ctx.lineCap='round';
      ctx.lineJoin='round';
      ctx.lineTo(p.x,p.y);
      ctx.stroke();
    });

    canvas.addEventListener('pointerup',()=>{
      if(!drawing)return;
      drawing=false;
      evaluate();
    });

    canvas.addEventListener('pointercancel',()=>{
      drawing=false;
      points=[];
    });

    /*
      累積播放：
      每一筆完成後不再消失。
    */
    function play(){
      clearTimeout(timer);
      strokeIndex=0;
      let i=0;

      function step(){
        if(i>=data().length){
          document.getElementById('feedback').textContent=text[lang].ready;
          return;
        }

        strokeIndex=i;
        scene();

        const p=demo.children[i];
        const L=p.getTotalLength();

        p.style.transition='none';
        p.style.strokeDasharray=L;
        p.style.strokeDashoffset=L;
        p.setAttribute('opacity','1');

        requestAnimationFrame(()=>{
          p.getBoundingClientRect();
          p.style.transition='stroke-dashoffset .75s ease';
          p.style.strokeDashoffset='0';
        });

        i++;
        timer=setTimeout(step,900);
      }

      step();
    }

    document.querySelectorAll('.lang').forEach(b=>b.addEventListener('click',()=>{
      lang=b.dataset.lang;
      applyText();
      render();
    }));

    document.querySelectorAll('.style-btn').forEach(b=>b.addEventListener('click',()=>{
      style=b.dataset.style;
      strokeIndex=0;
      clearDrawing();
      render();
    }));

    document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>{
      mode=b.dataset.mode;
      strokeIndex=0;
      clearDrawing();
      render();
    }));

    document.getElementById('prevLetter').addEventListener('click',()=>{
      idx=(idx+25)%26;
      strokeIndex=0;
      clearDrawing();
      render();
    });

    document.getElementById('nextLetter').addEventListener('click',()=>{
      idx=(idx+1)%26;
      strokeIndex=0;
      clearDrawing();
      render();
    });

    document.getElementById('prevStroke').addEventListener('click',()=>{
      clearTimeout(timer);
      strokeIndex=Math.max(0,strokeIndex-1);
      scene();
    });

    document.getElementById('nextStroke').addEventListener('click',()=>{
      clearTimeout(timer);
      strokeIndex=Math.min(data().length-1,strokeIndex+1);
      scene();
    });

    document.getElementById('playAll').addEventListener('click',play);

    document.getElementById('clearBtn').addEventListener('click',()=>{
      clearTimeout(timer);
      strokeIndex=0;
      clearDrawing();
      document.getElementById('feedback').textContent=text[lang].ready;
    });

    applyText();
    render();
  })();
  </script>
</body>
</html>
